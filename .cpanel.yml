---
# cPanel Git Version Control deployment (Namecheap shared hosting).
#
# How it works:
#   1. `npm run build:all` is run LOCALLY and the resulting dist/ is committed.
#   2. cPanel pulls this repo, then runs the tasks below as the cPanel user.
#   3. dist/ is copied into public_html/ — no Node/npm needed on the server.
#
# This mirrors what amplify.yml does on AWS and what .github/workflows/static.yml
# does for GitHub Pages; the difference is that Namecheap shared hosting has no
# usable Node toolchain in the deploy shell, so the build happens before commit.
#
# DEPLOYPATH is derived from the cPanel user's $HOME, which resolves to
# /home/coliryii/public_html/ on this account, so it survives an account change.
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/public_html/
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/bash -c 'if command -v rsync >/dev/null 2>&1; then rsync -a --delete --exclude=".well-known/" --exclude="cgi-bin/" --exclude=".htaccess" dist/ "$DEPLOYPATH"; else cp -Rf dist/. "$DEPLOYPATH"; fi'
    - /bin/echo "WebOctals deployed to $DEPLOYPATH"
