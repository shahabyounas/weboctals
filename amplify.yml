# AWS Amplify Hosting build settings.
#
# Without this file Amplify publishes the repository root verbatim, which is why
# the site was serving unminified source and the Parcel build was never used.
# With it, Amplify runs the build and publishes dist/ instead.
#
# Amplify reads this from the repo root automatically. If build settings were
# previously saved in the Amplify console, the console copy wins — see
# App settings > Build settings and remove the inline spec so this file is used.

version: 1
frontend:
  phases:
    preBuild:
      commands:
        # npm ci needs a lockfile and installs exactly what's committed.
        # package-lock.json is gitignored in this repo, so fall back to install.
        - if [ -f package-lock.json ]; then npm ci; else npm install; fi
    build:
      commands:
        # Cleans dist, builds every page, inlines critical CSS, then copies
        # robots.txt / sitemap.xml / llms.txt and any absolutely-referenced
        # assets (og:image, JSON-LD logo) into dist.
        - npm run build:all
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*

# Response headers live in customHttp.yml at the project root. AWS deprecated
# the customHeaders key in this file and recommends migrating out of it — a
# customHeaders block here is silently ignored.
