# AWS Amplify Hosting build settings.
#
# Without this file Amplify publishes the repository root verbatim, which is why
# the site was serving unminified source and the Parcel build was never used.
# With it, Amplify runs the build and publishes dist/ instead.
#
# Amplify reads this from the repo root automatically. If build settings were
# previously saved in the Amplify console, the console copy wins — see
# App settings > Build settings and remove the inline spec so this file is used.

version: 1
frontend:
  phases:
    preBuild:
      commands:
        # npm ci needs a lockfile and installs exactly what's committed.
        # package-lock.json is gitignored in this repo, so fall back to install.
        - if [ -f package-lock.json ]; then npm ci; else npm install; fi
    build:
      commands:
        # Cleans dist, builds every page, inlines critical CSS, then copies
        # robots.txt / sitemap.xml / llms.txt and any absolutely-referenced
        # assets (og:image, JSON-LD logo) into dist.
        - npm run build:all
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*

# Parcel fingerprints CSS/JS/images (app.a1b2c3d4.js), so those are safe to
# cache forever. HTML must revalidate, or visitors keep getting the old page
# pointing at assets that no longer exist. sitemap/robots stay short-lived so
# crawlers pick changes up quickly.
customHeaders:
  - pattern: '**/*.html'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=0, must-revalidate'
  - pattern: '/'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=0, must-revalidate'
  - pattern: '**/*.@(js|css|woff|woff2|jpg|jpeg|png|svg|webp|avif|ico)'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  - pattern: '/assets/**'
    headers:
      # Unhashed originals, kept for absolute URLs like the og:image card.
      # A day is long enough to be cheap, short enough that replacing the
      # share card doesn't need a cache invalidation.
      - key: 'Cache-Control'
        value: 'public, max-age=86400'
  - pattern: '/@(sitemap.xml|robots.txt|llms.txt)'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=3600'
